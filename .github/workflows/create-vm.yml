name: OCI Osaka A1 Auto Create

on:
  # 每 10 分钟自动尝试一次
  schedule:
    - cron: "*/10 * * * *"

  # 允许手动运行
  workflow_dispatch:

# 防止定时任务和手动任务同时运行
concurrency:
  group: oci-a1-instance-launch
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_CLI_IMAGE }}
  SUBNET_ID: ${{ secrets.OCI_CLI_SUBNET }}
  AD_NAME: ${{ secrets.OCI_CLI_AVAILABILITY_DOMAIN }}

  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY: ${{ secrets.OCI_CLI_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ================================
      # Cache pip
      # ================================
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v2

      # ================================
      # OCI CLI PATH
      # ================================
      - name: Add OCI CLI to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ================================
      # Launch OCI A1
      # ================================
      - name: Launch OCI A1 Instance
        id: create_vm
        run: |
          set -uo pipefail

          echo "========================================"
          echo "OCI A1 INSTANCE LAUNCH"
          echo "========================================"
          echo "Region:       $OCI_CLI_REGION"
          echo "AD:           $AD_NAME"
          echo "Shape:        VM.Standard.A1.Flex"
          echo "OCPU:         2"
          echo "RAM:          12 GB"
          echo "Boot volume:  100 GB"
          echo "========================================"
          echo ""

          # --------------------------------
          # Install OCI CLI
          # --------------------------------
          echo "Installing OCI CLI..."

          pip install --user --upgrade oci-cli

          echo ""
          echo "OCI CLI version:"
          oci --version
          echo ""

          # --------------------------------
          # Prepare OCI config
          # --------------------------------
          mkdir -p ~/.oci

          printf '%s\n' "${OCI_CLI_KEY}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

          chmod 600 ~/.oci/config

          # --------------------------------
          # Prepare SSH public key
          # --------------------------------
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" \
            > /home/runner/my_ssh_key.pub

          chmod 600 /home/runner/my_ssh_key.pub

          echo "SSH public key prepared."
          echo ""

          # --------------------------------
          # Launch function
          # --------------------------------
          launch_instance() {
            oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 100 \
              2>&1
          }

          # ========================================
          # Launch / retry
          # ========================================

          MAX_429_RETRIES=3

          for ATTEMPT in $(seq 1 $((MAX_429_RETRIES + 1))); do

            echo ""
            echo "========================================"
            echo "Launch attempt: $ATTEMPT / $((MAX_429_RETRIES + 1))"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================"
            echo ""

            OCI_OUTPUT="$(launch_instance)"
            OCI_EXIT_CODE=$?

            echo ""
            echo "========== OCI OUTPUT =========="
            echo "$OCI_OUTPUT"
            echo "================================"
            echo ""

            # ========================================
            # SUCCESS
            # ========================================

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then

              echo ""
              echo "========================================"
              echo "SUCCESS"
              echo "========================================"
              echo "OCI accepted the instance creation request."
              echo "Instance is PROVISIONING."
              echo "========================================"

              exit 0
            fi

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "RUNNING"'; then

              echo ""
              echo "========================================"
              echo "SUCCESS"
              echo "========================================"
              echo "Instance is RUNNING."
              echo "========================================"

              exit 0
            fi

            # ========================================
            # 429 TooManyRequests
            # ========================================

            if echo "$OCI_OUTPUT" | grep -q '"code": "TooManyRequests"'; then

              echo ""
              echo "========================================"
              echo "OCI API RATE LIMIT - 429"
              echo "========================================"
              echo "Oracle returned TooManyRequests."
              echo ""

              if [ "$ATTEMPT" -le "$MAX_429_RETRIES" ]; then

                case "$ATTEMPT" in
                  1)
                    WAIT_TIME=60
                    ;;
                  2)
                    WAIT_TIME=120
                    ;;
                  3)
                    WAIT_TIME=300
                    ;;
                  *)
                    WAIT_TIME=300
                    ;;
                esac

                echo "Waiting ${WAIT_TIME} seconds before retry..."
                sleep "$WAIT_TIME"

                continue
              fi

              echo ""
              echo "========================================"
              echo "429 RETRY LIMIT REACHED"
              echo "========================================"
              echo "No more retries in this workflow."
              echo "The next scheduled run will try again."
              echo "GitHub Action will remain SUCCESS."
              echo "========================================"

              # 故意返回成功，避免 GitHub 失败邮件
              exit 0
            fi

            # ========================================
            # Out of host capacity
            # ========================================

            if echo "$OCI_OUTPUT" | grep -qi "Out of host capacity"; then

              echo ""
              echo "========================================"
              echo "OUT OF HOST CAPACITY"
              echo "========================================"
              echo "OCI currently has no available A1 host."
              echo ""
              echo "The next scheduled run will try again."
              echo "GitHub Action will remain SUCCESS."
              echo "========================================"

              # 故意返回成功
              exit 0
            fi

            # ========================================
            # Other OCI error
            # ========================================

            echo ""
            echo "========================================"
            echo "OCI INSTANCE CREATION FAILED"
            echo "========================================"
            echo "Exit code: $OCI_EXIT_CODE"
            echo ""
            echo "The next scheduled run will try again."
            echo "GitHub Action will remain SUCCESS."
            echo "========================================"

            # 其他错误也故意返回成功
            exit 0

          done