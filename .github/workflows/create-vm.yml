name: Try to Create OCI Osaka A1 VM

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_OSAKA_SUBNET_ID }}

  # 必须替换成大阪区域的 Ubuntu/Oracle Linux 镜像 OCID
  IMAGE_ID: ${{ secrets.OCI_OSAKA_IMAGE_ID }}

  OCI_CLI_REGION: "ap-osaka-1"

  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          python3 -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        run: |
          set -e

          mkdir -p "$HOME/.oci"

          cat > "$HOME/.oci/oci_api_key.pem" <<'EOF'
          ${{ secrets.OCI_CLI_KEY_CONTENT }}
          EOF

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

          printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' \
            > "$HOME/my_ssh_key.pub"

      - name: Check whether VM already exists
        id: check_vm
        run: |
          set -e

          COUNT=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "coolify-vm" \
            --all \
            --query 'length(data[?"lifecycle-state" != `TERMINATED`])' \
            --raw-output)

          echo "Existing VM count: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "VM already exists. Nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Try to create Osaka A1 VM
        if: steps.check_vm.outputs.exists != 'true'
        run: |
          set -e

          echo "Trying to create VM in Osaka..."
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPUs: 2"
          echo "Memory: 12 GB"

          oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "$HOME/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 50 \
            --wait-for-state RUNNING

          echo "VM created successfully."
