name: OCI Osaka A1 Auto Create

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: oci-a1-create
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT_ID: ${{ secrets.COMPARTMENT_ID }}
      IMAGE_ID: ${{ secrets.OCI_CLI_IMAGE }}
      SUBNET_ID: ${{ secrets.OCI_CLI_SUBNET }}
      AD_NAME: ${{ secrets.OCI_CLI_AVAILABILITY_DOMAIN }}

      INSTANCE_NAME: coolify-vm
      OCPU_COUNT: "2"
      MEMORY_GB: "12"
      BOOT_VOLUME_GB: "100"

      QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
      QQ_SMTP_PASSWORD: ${{ secrets.QQ_SMTP_PASSWORD }}
      QQ_RECEIVER: ${{ secrets.QQ_RECEIVER }}

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade oci-cli

      - name: Configure OCI CLI
        shell: bash
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY: ${{ secrets.OCI_CLI_KEY }}
        run: |
          mkdir -p ~/.oci

          printf '%s\n' "$OCI_CLI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          fingerprint=${OCI_CLI_FINGERPRINT}
          tenancy=${OCI_CLI_TENANCY}
          region=${OCI_CLI_REGION}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

          echo "OCI CLI configured."
          oci iam region list --output table

      - name: Check whether VM already exists
        id: check_vm
        shell: bash
        run: |
          set -e

          echo "Checking for existing instance: $INSTANCE_NAME"

          RESULT=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$INSTANCE_NAME" \
            --all \
            --output json)

          EXISTING=$(echo "$RESULT" | jq -r '
            [.data[] |
              select(.["lifecycle-state"] != "TERMINATED")
            ] | length
          ')

          echo "Existing instances: $EXISTING"

          if [ "$EXISTING" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Instance already exists. Nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing instance found."
          fi

      - name: Launch A1 instance
        if: steps.check_vm.outputs.exists == 'false'
        id: launch
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Attempting OCI A1 instance creation"
          echo "Region: $OCI_CLI_REGION"
          echo "AD: $AD_NAME"
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPU: $OCPU_COUNT"
          echo "RAM: ${MEMORY_GB} GB"
          echo "Boot volume: ${BOOT_VOLUME_GB} GB"
          echo "========================================"

          oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --display-name "$INSTANCE_NAME" \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --shape-config "{\"ocpus\":${OCPU_COUNT},\"memoryInGBs\":${MEMORY_GB}}" \
            --boot-volume-size-in-gbs "$BOOT_VOLUME_GB" \
            --assign-public-ip true \
            --ssh-authorized-keys-file <(printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}') \
            --wait-for-state RUNNING \
            --max-wait-seconds 600 \
            --output json > launch_result.json

          echo "Instance created successfully."

          INSTANCE_ID=$(jq -r '.data.id' launch_result.json)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: Could not get instance OCID."
            cat launch_result.json
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

          echo "Instance OCID:"
          echo "$INSTANCE_ID"

      - name: Send QQ success email
        if: steps.launch.outcome == 'success'
        shell: python
        env:
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          REGION: ${{ env.OCI_CLI_REGION }}
          INSTANCE_NAME: ${{ env.INSTANCE_NAME }}
          QQ_SMTP_USER: ${{ env.QQ_SMTP_USER }}
          QQ_SMTP_PASSWORD: ${{ env.QQ_SMTP_PASSWORD }}
          QQ_RECEIVER: ${{ env.QQ_RECEIVER }}
        run: |
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          sender = os.environ["QQ_SMTP_USER"]
          password = os.environ["QQ_SMTP_PASSWORD"]
          receiver = os.environ["QQ_RECEIVER"]

          instance_id = os.environ.get("INSTANCE_ID", "")
          region = os.environ.get("REGION", "")
          instance_name = os.environ.get("INSTANCE_NAME", "")

          subject = "OCI A1 ARM 实例创建成功"

          body = f"""
          OCI A1 ARM 实例创建成功！

          实例名称：{instance_name}
          Region：{region}
          Shape：VM.Standard.A1.Flex
          OCPU：2
          RAM：12 GB
          系统盘：100 GB

          Instance OCID：
          {instance_id}

          GitHub Actions 已经成功完成实例创建。

          后续可以进入 Oracle Cloud Console 查看公网 IP。
          """

          message = MIMEText(body, "plain", "utf-8")
          message["From"] = sender
          message["To"] = receiver
          message["Subject"] = Header(subject, "utf-8")

          print("Sending success email...")

          with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as server:
              server.login(sender, password)
              server.sendmail(sender, [receiver], message.as_string())

          print("Success email sent.")

      - name: Creation failed
        if: failure()
        run: |
          echo "========================================"
          echo "OCI A1 instance creation failed."
          echo "The next scheduled run will retry."
          echo "========================================"
