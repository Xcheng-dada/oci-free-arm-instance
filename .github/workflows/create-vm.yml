name: Try to Create OCI VM

# 每 5 分钟尝试一次
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  # OCI 基础资源
  COMPARTMENT_ID: ${{ secrets.COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_CLI_IMAGE }}
  SUBNET_ID: ${{ secrets.OCI_CLI_SUBNET }}
  AD_NAME: ${{ secrets.OCI_CLI_AVAILABILITY_DOMAIN }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 缓存 OCI CLI
      # ==============================
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      # ==============================
      # 把 ~/.local/bin 加入 PATH
      # ==============================
      - name: Add OCI CLI to path
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ==============================
      # 安装 OCI CLI + 尝试创建 A1
      # ==============================
      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true

        run: |

          set -o pipefail

          echo "========================================"
          echo "OCI A1 VM Creation Attempt"
          echo "Region: $OCI_CLI_REGION"
          echo "Availability Domain: $AD_NAME"
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPU: 2"
          echo "Memory: 12 GB"
          echo "Boot Volume: 50 GB"
          echo "========================================"

          # ==============================
          # 安装 OCI CLI
          # ==============================
          pip install oci-cli

          # ==============================
          # 创建 OCI 配置目录
          # ==============================
          mkdir -p ~/.oci

          # ==============================
          # 写入 OCI API 私钥
          # ==============================
          printf '%s\n' "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          # ==============================
          # 写入 OCI config
          # ==============================
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          region=${{ secrets.OCI_CLI_REGION }}
          EOF

          # 修复 config 权限
          chmod 600 ~/.oci/config

          # ==============================
          # 写入 SSH 公钥
          # ==============================
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          chmod 600 /home/runner/my_ssh_key.pub

          # ==============================
          # 测试 OCI API 认证
          # ==============================
          echo ""
          echo "========================================"
          echo "Testing OCI authentication..."
          echo "========================================"

          if oci iam region list --output json >/tmp/oci_test.json 2>&1; then
            echo "OCI authentication OK."
          else
            echo "OCI authentication FAILED."

            echo "========== OCI AUTH OUTPUT =========="
            cat /tmp/oci_test.json
            echo "====================================="

            exit 1
          fi

          # ==============================
          # 创建 A1 VM
          # ==============================
          echo ""
          echo "========================================"
          echo "Starting A1 VM creation..."
          echo "========================================"

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 50 \
            2>&1 || true)

          # ==============================
          # 输出 OCI 返回结果
          # ==============================
          echo ""
          echo "========== OCI OUTPUT =========="
          echo "$OCI_OUTPUT"
          echo "================================"
          echo ""

          # 保存日志到 GitHub Actions output
          {
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # ==============================
          # 判断是否创建成功
          # ==============================

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "========================================"
            echo "SUCCESS! A1 VM is PROVISIONING."
            echo "========================================"
            exit 0
          fi

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "RUNNING"'; then
            echo "========================================"
            echo "SUCCESS! A1 VM is RUNNING."
            echo "========================================"
            exit 0
          fi

          # ==============================
          # 创建失败
          # ==============================
          echo "========================================"
          echo "A1 creation attempt failed."
          echo "The next scheduled run will try again."
          echo "========================================"

          exit 1
